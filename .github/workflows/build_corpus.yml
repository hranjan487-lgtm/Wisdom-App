name: Build Osho Corpus (extract + embed)

on:
  workflow_dispatch:  # manual trigger from the Actions tab or GitHub mobile app

permissions:
  contents: write  # needed to commit the result back to the repo

jobs:
  build-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download PDFs from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python download_from_drive.py --folder-id "${{ secrets.DRIVE_FOLDER_ID }}" --out-dir pdfs

      - name: Verify PDFs downloaded
        run: |
          count=$(find pdfs -name "*.pdf" | wc -l)
          echo "Found $count PDF files in pdfs/"
          if [ "$count" -lt 150 ]; then
            echo "Too few PDFs downloaded ($count) - treating as a real failure."
            exit 1
          fi

      - name: Extract and embed corpus
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: python extract_and_embed.py --pdf-dir pdfs --out corpus_embeddings.jsonl

      - name: Commit result back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add corpus_embeddings.jsonl
          git diff --staged --quiet || git commit -m "Rebuild corpus embeddings"
          git push
